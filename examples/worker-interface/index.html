<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worker Interface Example</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
    integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
  <style>
    body { font-family: Helvetica, sans-serif; padding: 20px; }
    iframe { height: 600px; }
  </style>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.0/jquery.min.js"></script>
  <script src="./worker-interface.umd.js"></script>
  <script>
    let workerApi;

    (async () => {
      workerApi = await WorkerInterface.initializeHost({
        worker: './webworker.js',
      });
      const { root: api } = workerApi;

      console.log('Interface created');

      {
        // Call requestTime() from the Worker API
        const time = await api.requestTime();
        console.log('requestTime():', new Date(time));
      }

      {
        // Pass api.requestTime as a callback — the worker calls it back
        const time = await api.callHandler(api.requestTime);
        console.log('callHandler(requestTime):', time);
      }

      {
        // Access a resource-wrapped private API using a password
        const secretApi = api.getPrivateAPI('password1');
        const secretData = await secretApi.secretData();
        console.log('secretData():', secretData);
      }

      {
        // Alternative: unwrap a resource descriptor via workerApi.wrap()
        const apiResource = await api.getPrivateAPI('password1');
        const secretApi = workerApi.wrap(apiResource);
        const secretData = await secretApi.secretData();
        console.log('secretData() via wrap():', secretData);
      }

      console.log('Interface ready');
    })();

    let intervalId = 0;

    $(document).ready(() => {
      $('.start').on('click', () => {
        const tick = async () => {
          const time = await workerApi.root.requestTime();
          $('.time').val(time);
        };
        clearInterval(intervalId);
        intervalId = setInterval(tick, 1000);
        tick();
      });

      $('.stop').on('click', () => {
        clearInterval(intervalId);
        $('.time').val('');
      });
    });
  </script>
</head>
<body>
  <div class="container">
    <h2>Worker Interface Example <small>DDA proxy to a Web Worker</small></h2>
    <p class="text-muted">
      The main page and the Worker communicate through <code>postMessage</code> using DDA proxies.
      <code>api.requestTime()</code> calls a function defined in the Worker and returns its result
      as a plain Promise.
    </p>

    <div class="row">
      <div class="col-xs-12">
        <div class="form-group" style="max-width:260px">
          <label for="time">Timestamp from Worker:</label>
          <input type="text" class="time form-control" id="time" readonly>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary start">Start polling</button>
          <button class="btn btn-default stop">Stop</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>idb-proxy Example — Contacts</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
    integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.0/jquery.min.js"></script>
  <script src="./idb-proxy.umd.js"></script>
  <style>
    body { padding: 20px; }
    th, td { padding: 6px 10px; }
    table tbody tr:hover { background: #f0f4f8; cursor: pointer; }
    .badge-count {
      font-size: 13px;
      background: #2c5f8a;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
    .form-row .form-group { margin: 0; flex: 1; min-width: 140px; }
    .search-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .empty-state { color: #aaa; text-align: center; padding: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>idb-proxy Example <small>Contacts stored in IndexedDB</small></h2>
    <p class="text-muted">
      All data is persisted in IndexedDB via a DDA proxy. No backend needed —
      <code>db.contacts.put(record)</code>, <code>db.contacts.get(id)</code>,
      and <code>db.contacts.index('email').get(email)</code> work like plain async calls.
    </p>

    <!-- Add / Edit form -->
    <div class="panel panel-default">
      <div class="panel-heading" id="formTitle"><strong>Add Contact</strong></div>
      <div class="panel-body">
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" id="fName" placeholder="Alice Smith">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" id="fEmail" placeholder="alice@example.com">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" class="form-control" id="fPhone" placeholder="+1 555 000 0000">
          </div>
          <div class="form-group">
            <label>Category</label>
            <select class="form-control" id="fCategory">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <div>
              <button class="btn btn-primary" id="saveBtn">Save</button>
              <button class="btn btn-default" id="cancelBtn" style="display:none">Cancel</button>
            </div>
          </div>
        </div>
        <div id="formError" class="text-danger" style="display:none"></div>
      </div>
    </div>

    <!-- Search + filter -->
    <div class="search-row">
      <input type="email" class="form-control" id="searchEmail" placeholder="Find by email address…" style="max-width:280px">
      <button class="btn btn-default" id="searchBtn">Search</button>
      <button class="btn btn-link" id="clearSearchBtn">Show all</button>
      <span style="flex:1"></span>
      <select class="form-control" id="filterCategory" style="max-width:160px">
        <option value="">All categories</option>
        <option value="personal">Personal</option>
        <option value="work">Work</option>
        <option value="other">Other</option>
      </select>
      <button class="btn btn-default" id="filterBtn">Filter</button>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Category</th>
          <th style="width:110px">
            Total: <span class="badge-count" id="totalCount">0</span>
          </th>
        </tr>
      </thead>
      <tbody id="contactsBody">
        <tr><td colspan="5" class="empty-state">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // -----------------------------------------------------------------
    // Database setup
    // -----------------------------------------------------------------
    const db = IdbProxy.createIdbProxy('contacts-demo', {
      version: 1,
      upgrade(idb) {
        const store = idb.createObjectStore('contacts', { keyPath: 'id', autoIncrement: true });
        store.createIndex('email',    'email',    { unique: true });
        store.createIndex('category', 'category', { unique: false });
      },
    });

    // -----------------------------------------------------------------
    // Render helpers
    // -----------------------------------------------------------------
    function renderTable(contacts) {
      const tbody = document.getElementById('contactsBody');
      document.getElementById('totalCount').textContent = contacts.length;

      if (!contacts.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No contacts found.</td></tr>';
        return;
      }

      tbody.innerHTML = contacts.map(c => `
        <tr data-id="${c.id}">
          <td>${esc(c.name)}</td>
          <td>${esc(c.email)}</td>
          <td>${esc(c.phone || '—')}</td>
          <td><span class="label label-default">${esc(c.category)}</span></td>
          <td>
            <button class="btn btn-xs btn-warning edit-btn" data-id="${c.id}">Edit</button>
            <button class="btn btn-xs btn-danger  del-btn"  data-id="${c.id}">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showError(msg) {
      const el = document.getElementById('formError');
      el.textContent = msg;
      el.style.display = msg ? '' : 'none';
    }

    // -----------------------------------------------------------------
    // Load / refresh
    // -----------------------------------------------------------------
    async function loadAll() {
      const contacts = await db.contacts.getAll();
      renderTable(contacts);
    }

    // -----------------------------------------------------------------
    // Add / Edit
    // -----------------------------------------------------------------
    let editingId = null;

    function resetForm() {
      ['fName','fEmail','fPhone'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fCategory').value = 'personal';
      document.getElementById('formTitle').innerHTML = '<strong>Add Contact</strong>';
      document.getElementById('cancelBtn').style.display = 'none';
      showError('');
      editingId = null;
    }

    document.getElementById('saveBtn').onclick = async () => {
      const name     = document.getElementById('fName').value.trim();
      const email    = document.getElementById('fEmail').value.trim();
      const phone    = document.getElementById('fPhone').value.trim();
      const category = document.getElementById('fCategory').value;

      if (!name || !email) { showError('Name and email are required.'); return; }

      const record = { name, email, phone, category };
      if (editingId != null) record.id = editingId;

      try {
        if (editingId != null) {
          await db.contacts.put(record);
        } else {
          await db.contacts.add(record);
        }
        resetForm();
        await loadAll();
      } catch (e) {
        showError('Could not save: ' + (e.message || e));
      }
    };

    document.getElementById('cancelBtn').onclick = resetForm;

    // Delegated edit / delete
    document.getElementById('contactsBody').addEventListener('click', async e => {
      const editBtn = e.target.closest('.edit-btn');
      const delBtn  = e.target.closest('.del-btn');

      if (editBtn) {
        const id = Number(editBtn.dataset.id);
        const contact = await db.contacts.get(id);
        if (!contact) return;
        document.getElementById('fName').value     = contact.name;
        document.getElementById('fEmail').value    = contact.email;
        document.getElementById('fPhone').value    = contact.phone || '';
        document.getElementById('fCategory').value = contact.category;
        document.getElementById('formTitle').innerHTML = '<strong>Edit Contact</strong> <small>id=' + id + '</small>';
        document.getElementById('cancelBtn').style.display = '';
        editingId = id;
        showError('');
      }

      if (delBtn) {
        const id = Number(delBtn.dataset.id);
        if (!confirm('Delete this contact?')) return;
        await db.contacts.delete(id);
        await loadAll();
      }
    });

    // -----------------------------------------------------------------
    // Search by email index
    // -----------------------------------------------------------------
    document.getElementById('searchBtn').onclick = async () => {
      const email = document.getElementById('searchEmail').value.trim();
      if (!email) { await loadAll(); return; }

      const contact = await db.contacts.index('email').get(email);
      renderTable(contact ? [contact] : []);
    };

    document.getElementById('clearSearchBtn').onclick = async () => {
      document.getElementById('searchEmail').value = '';
      await loadAll();
    };

    // -----------------------------------------------------------------
    // Filter by category index
    // -----------------------------------------------------------------
    document.getElementById('filterBtn').onclick = async () => {
      const category = document.getElementById('filterCategory').value;
      if (!category) { await loadAll(); return; }

      const contacts = await db.contacts.index('category').getAll(category);
      renderTable(contacts);
    };

    // -----------------------------------------------------------------
    // Seed some sample data on first run
    // -----------------------------------------------------------------
    async function seedIfEmpty() {
      const count = await db.contacts.count();
      if (count > 0) return;

      const samples = [
        { name: 'Alice Smith',  email: 'alice@example.com',  phone: '+1 555 001 0001', category: 'work'     },
        { name: 'Bob Jones',    email: 'bob@example.com',    phone: '+1 555 001 0002', category: 'personal' },
        { name: 'Carol White',  email: 'carol@example.com',  phone: '+1 555 001 0003', category: 'work'     },
        { name: 'Dave Brown',   email: 'dave@example.com',   phone: '+1 555 001 0004', category: 'other'    },
        { name: 'Eve Johnson',  email: 'eve@example.com',    phone: '+1 555 001 0005', category: 'personal' },
      ];

      for (const c of samples) {
        await db.contacts.add(c);
      }
    }

    // -----------------------------------------------------------------
    // Bootstrap
    // -----------------------------------------------------------------
    seedIfEmpty().then(loadAll);
  </script>
</body>
</html>

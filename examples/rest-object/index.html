<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REST Object Example</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
    integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
  <style>
    body { font-family: Helvetica, sans-serif; padding: 20px; }
    th, td { padding: 4px 8px; }
    table tbody tr:nth-child(even) { background-color: #fafafa; }
    table tbody tr:hover { cursor: pointer; background-color: #e0f0f0; }
    table tbody td:last-child { width: 15%; }
    table thead th { background-color: #aaeeff; }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="./rest-object.umd.js"></script>
  <!-- Switch between the two approaches: method-style API or raw proxy operations -->
  <script src="./example.methods.js"></script>
  <!--<script src="./example.proxy.js"></script>-->
</head>
<body>
  <div class="container">
    <h2>REST Object Example <small>DDA proxy over HTTP</small></h2>
    <p class="text-muted">
      Property access and method calls on the proxy are translated into HTTP requests.
      <code>customers.read()</code> → <code>GET /example/api/portal/users/customers</code>,
      <code>customers[id].update(null, data)</code> → <code>PUT …/:id</code>, and so on.
    </p>

    <div class="row">
      <div class="col-sm-5">
        <h4>Add / Edit customer</h4>
        <form class="edit">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name">
          </div>
          <div class="form-group">
            <label for="company">Company</label>
            <input type="text" class="form-control" id="company">
          </div>
          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" min="18" max="120" class="form-control" id="age">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" class="form-control" id="phone">
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" class="form-control" id="address">
          </div>
          <button class="save btn btn-primary btn-block hidden">Save Changes</button>
          <button class="add btn btn-default btn-block">Add as New</button>
        </form>
      </div>
      <div class="col-sm-7">
        <h4>Customer list</h4>
        <table class="list" width="100%">
          <thead>
            <tr>
              <th>Name</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
